name: Build Windows EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Pre-download ffmpeg so it gets bundled inside the exe
        run: python -c "from static_ffmpeg import run; run.get_or_fetch_platform_executables_else_raise()"

      - name: Build exe
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name YouTubeDownloaderPro
          --collect-all yt_dlp
          --collect-all customtkinter
          --collect-all static_ffmpeg
          youtube_downloader_pro.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeDownloaderPro-windows
          path: dist/YouTubeDownloaderPro.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/YouTubeDownloaderPro.exe
          generate_release_notes: true
